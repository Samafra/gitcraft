name: Build GitCraft Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: GitCraft-Windows-x64.exe
            bin: target/x86_64-pc-windows-msvc/release/gitcraft.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: GitCraft-Linux-x64
            bin: target/x86_64-unknown-linux-gnu/release/gitcraft
          - os: macos-latest
            target: universal-apple-darwin
            artifact: GitCraft-macOS-Universal.dmg
            bin: target/universal-apple-darwin/release/GitCraft-macOS-Universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - name: Generate Windows ICO
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pip install pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32)])"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build Desktop & Installer
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release --target x86_64-apple-darwin
            cargo build --release --target aarch64-apple-darwin
            OUT="target/universal-apple-darwin/release"
            APP="$OUT/GitCraft.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" GitCraft.iconset
            lipo -create target/x86_64-apple-darwin/release/gitcraft target/aarch64-apple-darwin/release/gitcraft -output "$APP/Contents/MacOS/gitcraft"
            sips -z 128 128 assets/icon.png --out GitCraft.iconset/icon_128x128.png
            sips -z 256 256 assets/icon.png --out GitCraft.iconset/icon_128x128@2x.png
            iconutil -c icns GitCraft.iconset -o "$APP/Contents/Resources/AppIcon.icns"
            printf '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>gitcraft</string><key>CFBundleIdentifier</key><string>com.samafra.gitcraft</string><key>CFBundleName</key><string>GitCraft</string><key>CFBundleIconFile</key><string>AppIcon</string><key>CFBundlePackageType</key><string>APPL</string><key>NSHighResolutionCapable</key><true/></dict></plist>' > "$APP/Contents/Info.plist"
            hdiutil create -volname "GitCraft" -srcfolder "$APP" -ov -format UDZO "$OUT/GitCraft-macOS-Universal.dmg"
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk & Build Web
        run: |
          cargo install trunk
          trunk build --release --public-url ./
      - uses: actions/upload-artifact@v4
        with:
          name: GitCraft-Web-WASM
          path: dist/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
